name = "draleila"
main = "index.js"
compatibility_date = "2026-01-01"

[vars]
PIXEL_ID = "786053772867277"
# Domínios da LP que podem chamar o worker, separados por vírgula.
# Trocar/adicionar quando o domínio final da LP estiver definido.
ALLOWED_ORIGIN = "https://draleilalp.netlify.app,https://claude-dreamy-allen-gwoych--draleilalp.netlify.app"

# Segredos (não vão no git — configurar no dashboard ou via `wrangler secret put`):
#   META_ACCESS_TOKEN     -> token de acesso da API de Conversões do pixel
#   OFFLINE_EVENTS_TOKEN  -> senha à sua escolha, para reportar eventos offline
#                            (consulta realizada / agendamento confirmado)
# Opcional:
#   TEST_EVENT_CODE       -> código do "Testar eventos" no Gerenciador de Eventos

# KV usado pelos eventos offline (casa o evento com o clique original).
# Namespace "draleila-leads", criado na conta Cloudflare.
[[kv_namespaces]]
binding = "LEADS"
id = "47404a90cf0842e986cd131635dff1f7"
